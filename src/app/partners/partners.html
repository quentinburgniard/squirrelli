<div class="flex flex-wrap items-start justify-between gap-4">
  <h2>Partners</h2>
  <a matButton="filled" routerLink="/partners/edit">Add partner</a>
</div>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="partners$">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let partner">{{ partner.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let partner">{{ partner.email }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let partner" class="text-right">
          <a matButton [routerLink]="['/partners/edit', partner.documentId]">Edit</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </mat-card-content>
</mat-card>
