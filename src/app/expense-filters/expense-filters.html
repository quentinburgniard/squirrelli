<div class="flex justify-end">
  <button
    matIconButton
    type="button"
    [attr.aria-label]="'filterExpenses' | translate"
    [attr.aria-expanded]="open()"
    (click)="open.update((value) => !value)"
  >
    <mat-icon>filter_list</mat-icon>
    @if (activeFilterCount() > 0) {
      <span
        class="absolute top-0 right-0 flex size-5 items-center justify-center rounded-full bg-[var(--mat-sys-primary)] text-[10px] font-bold text-[var(--mat-sys-on-primary)]"
      >
        {{ activeFilterCount() }}
      </span>
    }
  </button>
</div>

@if (open()) {
  <div class="mt-3 rounded-2xl bg-[var(--mat-sys-surface-container-high)] p-4">
    <form [formGroup]="form" class="grid gap-3 md:grid-cols-2 xl:grid-cols-5">
      <mat-form-field class="w-full">
        <mat-label>{{ 'filterMerchantOrCategory' | translate }}</mat-label>
        <input matInput formControlName="merchant" [placeholder]="'searchByName' | translate" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>{{ 'fromDate' | translate }}</mat-label>
        <input matInput formControlName="fromDate" [matDatepicker]="fromPicker" />
        <mat-datepicker-toggle matIconSuffix [for]="fromPicker" />
        <mat-datepicker #fromPicker />
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>{{ 'untilFilterDate' | translate }}</mat-label>
        <input matInput formControlName="untilDate" [matDatepicker]="untilPicker" />
        <mat-datepicker-toggle matIconSuffix [for]="untilPicker" />
        <mat-datepicker #untilPicker />
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>{{ 'minimumAmount' | translate }}</mat-label>
        <input matInput type="number" formControlName="minimumAmount" min="0" />
        <span matTextSuffix>€</span>
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>{{ 'maximumAmount' | translate }}</mat-label>
        <input matInput type="number" formControlName="maximumAmount" min="0" />
        <span matTextSuffix>€</span>
      </mat-form-field>
    </form>

    <div class="flex justify-end">
      <button matButton type="button" (click)="clear()">{{ 'clearFilters' | translate }}</button>
    </div>
  </div>
}
