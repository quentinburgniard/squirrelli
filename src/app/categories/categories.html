<div>
  <h1>{{ 'expenseCategories' | translate }}</h1>
  <p class="mt-1 text-[var(--mat-sys-on-surface-variant)]">
    {{ 'categoriesDescription' | translate }}
  </p>
</div>

<mat-card>
  <mat-card-content>
    @if (categories$ | async; as categories) {
      <ul class="m-0 list-none divide-y divide-[var(--mat-sys-outline-variant)] p-0">
        @for (category of categories; track category.documentId) {
          <li>
            <a
              class="flex items-center justify-between gap-4 px-2 py-4 text-[var(--mat-sys-on-surface)]"
              [routerLink]="['/expenses/categories', category.documentId]"
            >
              <span class="font-semibold">{{ category.name }}</span>
              <mat-icon aria-hidden="true">chevron_right</mat-icon>
            </a>
          </li>
        } @empty {
          <li><squirrelli-empty message="noCategoriesFound" /></li>
        }
      </ul>
    }
  </mat-card-content>
</mat-card>
