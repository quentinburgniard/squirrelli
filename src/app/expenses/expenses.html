<section
  class="relative overflow-hidden rounded-3xl bg-[var(--mat-sys-surface-container)] px-5 py-5 md:px-8 md:py-7"
>
  <div
    class="grid grid-cols-[minmax(0,2fr)_minmax(176px,3fr)] items-center gap-2 md:grid-cols-[minmax(0,1fr)_minmax(144px,45%)] md:gap-8"
  >
    <div class="relative z-10 self-start pt-2 md:pt-4">
      <h1 class="text-3xl md:text-4xl">{{ 'expenses' | translate }}</h1>
    </div>

    <img
      class="h-44 w-full scale-110 object-contain object-center md:h-48 md:max-w-sm md:justify-self-end"
      [src]="imageUrl"
      alt=""
      aria-hidden="true"
    />
  </div>
</section>
<mat-card>
  <mat-card-content>
    <squirrelli-expense-filters (filtersChange)="updateFilters($event)" />

    @if (filteredExpenses$ | async; as expenses) {
      <div class="mt-2 mb-3 flex items-center justify-between gap-3">
        <span class="text-sm text-[var(--mat-sys-on-surface-variant)]">
          {{ expenses.length }}
          {{ (expenses.length === 1 ? 'expenseSingular' : 'expensesPlural') | translate }}
        </span>
      </div>

      <ul class="m-0 list-none p-0">
        @for (expense of expenses; track expense.documentId) {
          <li><squirrelli-expense [expense]="expense" /></li>
        }
      </ul>

      @if (expenses.length === 0) {
        <squirrelli-empty message="noExpensesMatchFilters" />
      }
    }
  </mat-card-content>
</mat-card>

<squirrelli-floating-actions [nav]="actions" />
