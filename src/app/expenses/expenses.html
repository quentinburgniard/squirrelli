<div class="flex flex-wrap items-start justify-between gap-4">
  <h1>Expenses</h1>
  <div class="flex flex-wrap gap-2">
    <a class="rounded-xl bg-slate-900 px-4 py-3 font-semibold" routerLink="/expenses/import">
      Import expenses
    </a>
    <a
      class="rounded-xl bg-slate-900 px-4 py-3 font-semibold text-white"
      routerLink="/expenses/edit"
    >
      Add expense manually
    </a>
  </div>
</div>
<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="expenses$">
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let expense">
          {{ formatDate(expense.date) }}
        </td>
      </ng-container>
      <ng-container matColumnDef="merchant">
        <th mat-header-cell *matHeaderCellDef>Merchant</th>
        <td mat-cell *matCellDef="let expense">
          {{ expense.merchant?.name ?? expense.category?.name }}
        </td>
      </ng-container>
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let expense">{{ expense.amount }} €</td>
      </ng-container>
      <!-- <ng-container matColumnDef="amount">
        <button matIconButton aria-label="Example icon button with a vertical three dot icon">
          <mat-icon>more_vert</mat-icon>
        </button>
      </ng-container> -->
    </table>
  </mat-card-content>
</mat-card>
