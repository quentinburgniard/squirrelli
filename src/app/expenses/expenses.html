<section
  class="relative overflow-hidden rounded-3xl bg-[--mat-sys-surface-container] px-5 py-5 md:px-8 md:py-7"
>
  <div class="grid grid-cols-[minmax(0,1fr)_minmax(9rem,45%)] items-center gap-2 md:gap-8">
    <div class="relative z-10 self-start pt-2 md:pt-4">
      <h1 class="text-3xl md:text-4xl">Expenses</h1>
    </div>

    <img
      class="h-36 w-full scale-110 object-contain object-center md:h-48 md:max-w-sm md:justify-self-end"
      src="/expenses.png"
      alt=""
      aria-hidden="true"
    />

    <div class="relative z-10 col-span-2 grid gap-2 sm:flex sm:flex-wrap">
      <a
        class="rounded-xl bg-[--mat-sys-surface-container-high] px-4 py-3 text-center font-semibold"
        routerLink="/expenses/import"
      >
        Import expenses
      </a>
      <a
        class="rounded-xl bg-[--mat-sys-primary] px-4 py-3 text-center font-semibold text-[--mat-sys-on-primary]"
        routerLink="/expenses/edit"
      >
        Add expense manually
      </a>
    </div>
  </div>
</section>
<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="expenses$">
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let expense">
          {{ formatDate(expense.date) }}
        </td>
      </ng-container>
      <ng-container matColumnDef="merchant">
        <th mat-header-cell *matHeaderCellDef>Merchant</th>
        <td mat-cell *matCellDef="let expense">
          {{ expense.merchant?.name ?? expense.category?.name }}
        </td>
      </ng-container>
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let expense">{{ expense.amount }} €</td>
      </ng-container>
      <!-- <ng-container matColumnDef="amount">
        <button matIconButton aria-label="Example icon button with a vertical three dot icon">
          <mat-icon>more_vert</mat-icon>
        </button>
      </ng-container> -->
    </table>
  </mat-card-content>
</mat-card>
