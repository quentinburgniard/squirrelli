<h1>{{ (incomeId ? 'editIncome' : 'addIncome') | translate }}</h1>

<form [formGroup]="form" class="flex flex-col gap-4" (ngSubmit)="onSubmit()">
  <mat-form-field>
    <mat-label>{{ 'date' | translate }}</mat-label>
    <input matInput formControlName="date" [matDatepicker]="picker" />
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field>
    <mat-label>{{ 'amount' | translate }}</mat-label>
    <input matInput formControlName="amount" type="number" min="0" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>{{ 'currency' | translate }}</mat-label>
    <mat-select formControlName="currency">
      @for (currency of currencies; track currency) {
        <mat-option [value]="currency">{{ currency.toUpperCase() }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <div class="flex gap-2">
    <button matButton="filled" type="submit" [disabled]="form.invalid || loading">
      {{ 'save' | translate }}
    </button>
    <a matButton routerLink="/incomes">{{ 'cancel' | translate }}</a>
  </div>
</form>
