<div class="flex flex-wrap items-start justify-between gap-4">
  <h2>{{ 'friends' | translate }}</h2>
  <a matButton="filled" routerLink="/expenses/friends/edit">{{ 'addFriend' | translate }}</a>
</div>

<mat-card>
  <mat-card-content>
    @if (friends$ | async; as friends) {
      <table mat-table [dataSource]="friends">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>{{ 'name' | translate }}</th>
          <td mat-cell *matCellDef="let friend">{{ friend.name }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>{{ 'email' | translate }}</th>
          <td mat-cell *matCellDef="let friend">{{ friend.email }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: columns"
          class="cursor-pointer hover:bg-[var(--mat-sys-surface-container-high)]"
          [routerLink]="['/expenses/friends', row.documentId]"
          [attr.aria-label]="row.name"
        ></tr>
      </table>
      @if (friends.length === 0) {
        <squirrelli-empty message="noFriendsYet" />
      }
    }
  </mat-card-content>
</mat-card>
