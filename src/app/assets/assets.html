<section
  class="relative overflow-hidden rounded-3xl bg-[--mat-sys-surface-container] px-5 py-5 md:px-8 md:py-7"
>
  <div
    class="grid grid-cols-[minmax(0,2fr)_minmax(176px,3fr)] items-center gap-2 md:grid-cols-[minmax(0,1fr)_minmax(144px,45%)] md:gap-8"
  >
    <div class="relative z-10 self-start pt-2 md:pt-4">
      <h1 class="text-3xl md:text-4xl">Assets</h1>
    </div>

    <img
      class="h-44 w-full scale-110 object-contain object-center md:h-48 md:max-w-sm md:justify-self-end"
      src="/assets.png"
      alt=""
      aria-hidden="true"
    />

    <div class="relative z-10 col-span-2 grid gap-2 sm:flex sm:flex-wrap">
      <a
        class="rounded-xl bg-[--mat-sys-primary] px-4 py-3 text-center font-semibold text-[--mat-sys-on-primary]"
        routerLink="/assets/edit"
      >
        Add asset
      </a>
    </div>
  </div>
</section>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="assets$">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let asset">{{ asset.name }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let asset">{{ asset.category?.name }}</td>
      </ng-container>

      <ng-container matColumnDef="liquidity">
        <th mat-header-cell *matHeaderCellDef>Liquidity</th>
        <td mat-cell *matCellDef="let asset">{{ asset.liquidity }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let asset" class="text-right">
          <a matButton [routerLink]="['/assets/edit', asset.documentId]">Edit</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </mat-card-content>
</mat-card>
