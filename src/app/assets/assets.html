<div class="flex flex-wrap items-start justify-between gap-4">
  <h1>Assets</h1>
  <a matButton="filled" routerLink="/assets/edit">Add asset</a>
</div>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="assets$">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let asset">{{ asset.name }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let asset">{{ asset.category?.name }}</td>
      </ng-container>

      <ng-container matColumnDef="liquidity">
        <th mat-header-cell *matHeaderCellDef>Liquidity</th>
        <td mat-cell *matCellDef="let asset">{{ asset.liquidity }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let asset" class="text-right">
          <a matButton [routerLink]="['/assets/edit', asset.documentId]">Edit</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </mat-card-content>
</mat-card>
