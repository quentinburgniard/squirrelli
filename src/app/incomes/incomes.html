<div class="flex flex-wrap items-start justify-between gap-4">
  <h1>Incomes</h1>
  <a matButton="filled" routerLink="/incomes/edit">Add income</a>
</div>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="incomes$">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let income">{{ formatDate(income.date) }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let income">
          {{ income.amount }} {{ income.currency.toUpperCase() }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let income" class="text-right">
          <a matButton [routerLink]="['/incomes/edit', income.documentId]">Edit</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </mat-card-content>
</mat-card>
