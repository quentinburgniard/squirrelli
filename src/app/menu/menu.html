@if (open) {
  <div
    class="menu-panel fixed inset-0 z-50 overflow-x-hidden overflow-y-auto backdrop-blur-sm"
    animate.leave="menu-leave"
    (click)="closed.emit()"
  >
    <nav
      [attr.aria-label]="'mainNavigation' | translate"
      class="relative mx-auto my-20 grid w-[calc(100%_-_32px)] max-w-3xl gap-3 text-base font-semibold text-[var(--mat-sys-on-surface)] md:w-full"
      (click)="$event.stopPropagation()"
    >
      <a
        class="rounded-xl bg-[var(--mat-sys-surface-container-high)] px-4 py-3 shadow-sm md:py-5"
        routerLink="/"
        (click)="closed.emit()"
      >
        <span>{{ 'dashboard' | translate }}</span>
      </a>
      <a
        class="rounded-xl bg-[var(--mat-sys-surface-container-high)] px-4 py-3 shadow-sm md:py-5"
        routerLink="/expenses"
        (click)="closed.emit()"
      >
        <span>{{ 'expensesNavigation' | translate }}</span>
      </a>
      <a
        class="rounded-xl bg-[var(--mat-sys-surface-container-high)] px-4 py-3 shadow-sm md:py-5"
        routerLink="/incomes"
        (click)="closed.emit()"
      >
        <span>{{ 'incomesNavigation' | translate }}</span>
      </a>
      <a
        class="rounded-xl bg-[var(--mat-sys-surface-container-high)] px-4 py-3 shadow-sm md:py-5"
        routerLink="/assets"
        (click)="closed.emit()"
      >
        <span>{{ 'assetsNavigation' | translate }}</span>
      </a>
      <a
        class="rounded-xl bg-[var(--mat-sys-surface-container-high)] px-4 py-3 shadow-sm md:py-5"
        routerLink="/settings"
        (click)="closed.emit()"
      >
        <span>{{ 'settingsNavigation' | translate }}</span>
      </a>
    </nav>
  </div>
}
