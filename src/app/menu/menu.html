@if (open) {
  <div
    class="menu-panel fixed inset-x-0 bottom-0 z-50 overflow-x-hidden overflow-y-auto p-3 sm:p-4"
    animate.leave="menu-leave"
    (click)="closed.emit()"
  >
    <nav
      [attr.aria-label]="'mainNavigation' | translate"
      class="relative mx-auto grid w-full max-w-xl gap-1 text-base text-[var(--mat-sys-on-surface)] sm:mt-2"
      (click)="$event.stopPropagation()"
    >
      <a
        class="menu-link"
        routerLink="/"
        routerLinkActive="menu-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closed.emit()"
      >
        <span class="menu-link-icon"><svg solarWidget5BoldDuotone [size]="22"></svg></span>
        <span class="flex-1">{{ 'dashboard' | translate }}</span>
      </a>
      <nutio-submenu
        label="expensesNavigation"
        [items]="expenseItems"
        [open]="openSubmenu() === 'expenses'"
        (toggled)="toggleSubmenu('expenses')"
        (selected)="closed.emit()"
      >
        <svg submenuIcon solarBillListBoldDuotone [size]="22"></svg>
      </nutio-submenu>
      <nutio-submenu
        label="incomesNavigation"
        [items]="incomeItems"
        [open]="openSubmenu() === 'incomes'"
        (toggled)="toggleSubmenu('incomes')"
        (selected)="closed.emit()"
      >
        <svg submenuIcon solarBanknote2BoldDuotone [size]="22"></svg>
      </nutio-submenu>
      <nutio-submenu
        label="assetsNavigation"
        [items]="assetItems"
        [open]="openSubmenu() === 'assets'"
        (toggled)="toggleSubmenu('assets')"
        (selected)="closed.emit()"
      >
        <svg submenuIcon solarWalletMoneyBoldDuotone [size]="22"></svg>
      </nutio-submenu>
      <a
        class="menu-link"
        routerLink="/settings"
        routerLinkActive="menu-link-active"
        (click)="closed.emit()"
      >
        <span class="menu-link-icon"><svg solarSettingsBoldDuotone [size]="22"></svg></span>
        <span class="flex-1">{{ 'settingsNavigation' | translate }}</span>
      </a>
    </nav>
  </div>
}
