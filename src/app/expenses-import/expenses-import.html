<mat-stepper [linear]="isLinear" #stepper>
  <mat-step [stepControl]="firstFormGroup">
    <form [formGroup]="firstFormGroup">
      <ng-template matStepLabel>{{ 'selectFile' | translate }}</ng-template>
      <squirrelli-expenses-select-import-file (parsed)="onFileParsed($event)" />
    </form>
  </mat-step>
  <mat-step [stepControl]="secondFormGroup" [label]="'mapColumns' | translate">
    <form [formGroup]="secondFormGroup">
      {{ columnNames | json }}
      <mat-form-field>
        <mat-label>{{ 'address' | translate }}</mat-label>
        <input
          matInput
          formControlName="secondCtrl"
          [placeholder]="'addressExample' | translate"
          required
        />
      </mat-form-field>
      <div>
        <button matButton matStepperPrevious>{{ 'back' | translate }}</button>
        <button matButton matStepperNext>{{ 'next' | translate }}</button>
      </div>
    </form>
  </mat-step>
  <mat-step [label]="'review' | translate">
    <p class="text-sm text-[var(--mat-sys-on-surface-variant)]">
      {{ 'reviewImportDescription' | translate }}
    </p>
    <div>
      <button matButton matStepperPrevious>{{ 'back' | translate }}</button>
      <button matButton (click)="stepper.reset()">{{ 'reset' | translate }}</button>
    </div>
  </mat-step>
</mat-stepper>
