<div class="flex flex-col gap-4">
  <div>
    <h1>{{ 'upcomingExpenses' | translate }}</h1>
    <p class="text-sm text-[var(--mat-sys-on-surface-variant)]">
      {{ 'untilDate' | translate: { date: (untilDateLabel$ | async) || '' } }}
    </p>
  </div>

  <mat-card>
    <mat-card-content>
      <ul class="m-0 list-none p-0">
        @for (expense of expenses$ | async; track expense.documentId) {
          <li><squirrelli-expense [expense]="expense" /></li>
        }
      </ul>
    </mat-card-content>
  </mat-card>

  <squirrelli-last-months />

  <squirrelli-last-weeks />
</div>
