<div>
  <h1>{{ (friendId ? 'editFriend' : 'addFriend') | translate }}</h1>
</div>

<form [formGroup]="form" class="flex flex-col gap-4" (ngSubmit)="onSubmit()">
  <mat-form-field>
    <mat-label>{{ 'name' | translate }}</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>{{ 'email' | translate }}</mat-label>
    <input matInput formControlName="email" type="email" />
  </mat-form-field>

  <div class="flex gap-2">
    <button matButton="filled" type="submit" [disabled]="form.invalid || loading">
      {{ 'save' | translate }}
    </button>
    <a matButton routerLink="/expenses/friends">{{ 'cancel' | translate }}</a>
  </div>
</form>
